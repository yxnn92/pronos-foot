<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pronos Foot</title>
  <meta name="description" content="Pronostics football calculés automatiquement : Top 5, coupes d'Europe, sélections. Scores en direct.">
  <meta name="theme-color" content="#0a0f1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="appbar">
    <div class="appbar-in">
      <div class="brand">
        <span class="mark"><img src="assets/icon.svg" alt="" width="34" height="34"></span>
        <div class="brand-txt">
          <h1>Pronos Foot</h1>
          <p id="updated">Chargement…</p>
        </div>
      </div>
      <div class="appbar-actions">
        <span id="liveBadge" class="live-badge" hidden><i></i><b>0</b> en direct</span>
        <button id="themeBtn" class="icon-btn" aria-label="Changer de thème" title="Mode clair / sombre">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Navigation">
    <button data-tab="matchs" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg><span>Matchs</span></button>
    <button data-tab="semaine"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Semaine</span></button>
    <button data-tab="combis"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Combinés</span><i class="nav-count" id="myCount" hidden></i></button>
    <button data-tab="joueurs"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg><span>Joueurs</span></button>
    <button data-tab="classements"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg><span>Classements</span></button>
    <button data-tab="perf"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Perf</span></button>
  </nav>

  <main id="view">
    <div class="skeleton"><i></i><i></i><i></i><i></i></div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <button class="close icon-btn" id="closeModal" aria-label="Fermer">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer class="foot">
    Probabilités calculées par un modèle statistique (Elo + loi de Poisson) mélangé aux cotes du marché. Données ESPN.
    Aucune garantie de gain : pariez de façon responsable. 18+ · Joueurs Info Service 09 74 75 13 13.
  </footer>

  <script src="assets/app.js" type="module"></script>
</body>
</html>
