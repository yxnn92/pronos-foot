# Mise à jour automatique du site, gratuite, sans IA.
# GitHub lance ce programme tout seul aux heures ci-dessous (heure UTC = heure de Paris - 1 h en hiver).
name: Mise à jour des pronos

on:
  schedule:
    - cron: '17 6-15 * * *'           # toutes les heures de 7h à 16h (Paris)
    - cron: '2,17,32,47 16-22 * * *'  # toutes les 15 min de 17h à 23h45 (Paris) : compos, cotes de dernière minute
    - cron: '17 23,0,1,2,3,4 * * *'   # toutes les heures de minuit à 5h (Paris) : nuits NBA (blessés, cotes, scores)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths-ignore: ['data/**']

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pronos
  cancel-in-progress: false

jobs:
  # Étape 1 : calculer les pronos et préparer le site
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les données et calculer les pronos
        run: node scripts/update.mjs

      - name: NBA (matchs de la nuit, blessés, pronos)
        run: node scripts/nba.mjs || echo "NBA en échec, le foot continue"

      - name: Enregistrer les nouvelles données
        run: |
          git config user.name "pronos-bot"
          git config user.email "pronos-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mise à jour des pronos"
          git pull --rebase --autostash || true
          git push

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js assets data _site/
          rm -rf _site/data/cache

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Étape 2 : publier le site sur GitHub Pages
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
